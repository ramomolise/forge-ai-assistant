<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Forge AI Assistant home">
      <span class="brand__mark" aria-hidden="true">F</span>
      <span><strong>Forge AI Assistant</strong><small>Build with Hermes ZA</small></span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      <ul class="site-nav__main">
      {{ $currentPage := . }}
      {{ range site.Menus.main }}
        <li>
          {{ $isCurrent := $currentPage.IsMenuCurrent "main" . }}
          {{ $isAncestor := $currentPage.HasMenuCurrent "main" . }}
          <a
            href="{{ .URL }}"
            {{ if or $isCurrent $isAncestor }}class="active"{{ end }}
            {{ if $isCurrent }}aria-current="page"{{ end }}
          >{{ .Name }}</a>
        </li>
      {{ end }}
      </ul>
    </nav>
  </div>
</header>
