{{ define "main" }}
<section class="page-shell">
  <h1>{{ .Title }}</h1>

  {{ with .Description }}
    <p>{{ . }}</p>
  {{ end }}

  {{ .Content }}

  {{ if and .Pages (ne .Params.show_children false) }}
    <ul class="page-list">
      {{ range .Pages.ByWeight }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
          {{ with .Description }}
            <p>{{ . }}</p>
          {{ end }}
        </li>
      {{ end }}
    </ul>
  {{ end }}
</section>
{{ end }}
