name: Repository checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris-actions/hugo@v3
        with:
          hugo-version: "0.131.0"
          extended: true

      - name: Run repository tests
        run: make test
