baseURL = "https://ramomolise.github.io/forge-ai-assistant/"
languageCode = "en-za"
title = "Forge AI Assistant"
defaultContentLanguage = "en"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  description = "An open-source learning project informed by a private South African small-business AI assistant beta."
  githubRepository = "https://github.com/ramomolise/forge-ai-assistant"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 10

  [[menu.main]]
    name = "Set Up"
    pageRef = "/tutorials"
    weight = 20

  [[menu.main]]
    name = "Prompts"
    pageRef = "/prompt-library"
    weight = 30

  [[menu.main]]
    name = "Examples"
    pageRef = "/business-examples"
    weight = 40
