- term: "AI model"
  definition: "Software that generates output from input and context; its output is not automatically a verified fact."
- term: "Allowlist"
  definition: "An explicit list of permitted items, with other items denied by default."
- term: "API"
  definition: "A defined way for software systems to exchange requests and responses."
- term: "Backup"
  definition: "A separate recoverable copy of important data or configuration."
- term: "Configuration file"
  definition: "A file containing settings read by software."
- term: "DNS"
  definition: "The system that maps domain names to network destinations."
- term: "Environment variable"
  definition: "A named value made available to a running process."
- term: "Git"
  definition: "A version-control system that records file history and changes."
- term: "GitHub"
  definition: "An online service for hosting Git repositories and repository automation."
- term: "Least privilege"
  definition: "Granting only the minimum access needed for an approved purpose."
- term: "Linux user"
  definition: "An operating-system account with its own identity and permissions."
- term: "Log"
  definition: "A record of events produced by software."
- term: "Package"
  definition: "Software prepared for installation and updates through a documented source."
- term: "Prompt injection"
  definition: "Untrusted content intended to change assistant rules or misuse data and tools."
- term: "Rollback"
  definition: "Returning a change to a known earlier state."
- term: "Root user"
  definition: "The Linux administrator account with control over the whole system."
- term: "Secret"
  definition: "A private value, such as a password or token, that grants access or proves identity."
- term: "System prompt"
  definition: "High-priority instructions describing an assistant's role and behaviour."
- term: "systemd service"
  definition: "A long-running process managed by systemd on a compatible Linux system."
- term: "TLS"
  definition: "A protocol that encrypts network traffic and helps authenticate a service."
- term: "Tool calling"
  definition: "A model requesting a defined operation that separate software controls."
- term: "Tunnel"
  definition: "A connection that can map a public entry point to a local service."
- term: "VPS"
  definition: "A rented virtual computer that runs an operating system."
- term: "Webhook"
  definition: "An internet endpoint that receives events sent by another system."
